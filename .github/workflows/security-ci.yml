name: Security CI (SAST + SCA + DAST with ZAP CLI)

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # SAST 
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==1.36.0"

      - name: Run Semgrep and generate SARIF
        run: |
          semgrep --config p/ci --sarif -o semgrep.sarif --timeout 0 || true
          test -s semgrep.sarif || (echo "semgrep.sarif não gerado" && exit 2)

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Registra (não bloqueia) 
      - name: Gate temporário (registro High/Critical)
        run: |
          if grep -qi '"level":[[:space:]]*"error"' semgrep.sarif; then
            echo "::warning::SAST encontrou issues de alto risco (registro para evidência)."
          fi

  # SCA
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xmlstarlet (parser)
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "ChallengeXP"
          path: "."
          format: "ALL"
          out: "reports"

      - name: Publish SCA reports
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: reports/

      - name: Fail if High/Critical vulnerabilities
        run: |
          COUNT=$(xmlstarlet sel -t -v "count(/analysis/dependencies/dependency/vulnerabilities/vulnerability[severity='High' or severity='Critical'])" reports/dependency-check-report.xml || echo 0)
          echo "Vulns High/Critical: $COUNT"
          if [ "$COUNT" != "0" ] && [ "$COUNT" != "" ]; then
            echo "::error::SCA encontrou vulnerabilidades High/Critical."
            exit 1
          fi

  # DAST 
  dast:
      name: DAST (OWASP ZAP contra localhost)
      runs-on: ubuntu-latest
      needs: [sca]
      steps:
        - name: Checkout
          uses: actions/checkout@v4
    
        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: "20.x"
    
        - name: Install deps
          run: npm ci
    
        - name: Start app in background
          run: |
            nohup npm start >/tmp/app.log 2>&1 &
            for i in {1..30}; do
              curl -sf http://127.0.0.1:3000/health && break || sleep 2
            done
            # se falhar, mostra log da app antes de sair
            curl -s http://127.0.0.1:3000/health || (echo "App não respondeu"; echo "==== /tmp/app.log ===="; tail -n 200 /tmp/app.log || true; exit 1)
    
        - name: ZAP Baseline Scan
          uses: zaproxy/action-baseline@v0.10.0
          continue-on-error: true
          with:
            target: "http://127.0.0.1:3000"
            rules_file_name: ".zap/rules.tsv"
            cmd_options: "-a"
            allow_issue_writing: false
    
        - name: List files produced by ZAP / workspace
          if: always()
          run: |
            echo "== PWD =="
            pwd
            echo "== ls -la =="
            ls -la || true
            echo "== find . -maxdepth 2 -type f -name '*.html' -o -name '*zap*' -o -name '*.log' =="
            find . -maxdepth 2 -type f \( -name "*.html" -o -name "*zap*" -o -name "*.log" \) -print || true
    
        - name: Show app log (last 200 lines)
          if: always()
          run: |
            echo "==== tail /tmp/app.log ===="
            tail -n 200 /tmp/app.log || true
    
        - name: Upload ZAP artifacts (best effort)
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: zap-scan
            path: |
              report_html.html
              owasp_zap.log
              ./zap_scan.log
              ./**/report_html.html
              ./**/owasp_zap.log
              ./**/zap*.log
            if-no-files-found: warn
            
        - name: Gate – fail on High/Critical (or missing report)
          if: always()
          run: |
            set -e
            REPORT=""
            if [ -f report_html.html ]; then
              REPORT="report_html.html"
            else
              # tenta pegar um html gerado em subpasta
              CAND=$(find . -maxdepth 2 -type f -name "report_html.html" | head -n 1 || true)
              if [ -n "$CAND" ]; then REPORT="$CAND"; fi
            fi
    
            if [ -z "$REPORT" ]; then
              echo "::error::Relatório do ZAP não foi encontrado. Verifique os logs acima (passos 'ZAP Baseline Scan' e 'List files...')."
              exit 1
            fi
    
            echo "Usando relatório: $REPORT"
            if grep -E "Risk Level.*(High|Critical)" -i "$REPORT"; then
              echo "::error::DAST encontrou achados High/Critical."
              exit 1
            else
              echo "Sem High/Critical no relatório ZAP."
            fi

  # Gate final
  release_gate:
    name: Gate de Release + Notificação (simples)
    runs-on: ubuntu-latest
    needs: [dast]
    if: ${{ needs.dast.result == 'success' }}
    steps:
      - name: (Opcional) Notificar via Webhook
        run: |
          if [ -n "${{ secrets.SECURITY_WEBHOOK_URL }}" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"text":"Pipeline aprovado (SAST/SCA/DAST). Pronto para release!"}' \
              "${{ secrets.SECURITY_WEBHOOK_URL }}"
          else
            echo "Webhook não configurado."
