name: Security CI (SAST + SCA + DAST with ZAP CLI)

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # SAST 
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==1.36.0"

      - name: Run Semgrep and generate SARIF
        run: |
          semgrep --config p/ci --sarif -o semgrep.sarif --timeout 0 || true
          test -s semgrep.sarif || (echo "semgrep.sarif não gerado" && exit 2)

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Registra (não bloqueia) 
      - name: Gate temporário (registro High/Critical)
        run: |
          if grep -qi '"level":[[:space:]]*"error"' semgrep.sarif; then
            echo "::warning::SAST encontrou issues de alto risco (registro para evidência)."
          fi

  # SCA
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xmlstarlet (parser)
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "ChallengeXP"
          path: "."
          format: "ALL"
          out: "reports"

      - name: Publish SCA reports
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: reports/

      - name: Fail if High/Critical vulnerabilities
        run: |
          COUNT=$(xmlstarlet sel -t -v "count(/analysis/dependencies/dependency/vulnerabilities/vulnerability[severity='High' or severity='Critical'])" reports/dependency-check-report.xml || echo 0)
          echo "Vulns High/Critical: $COUNT"
          if [ "$COUNT" != "0" ] && [ "$COUNT" != "" ]; then
            echo "::error::SCA encontrou vulnerabilidades High/Critical."
            exit 1
          fi

  # DAST 
  dast:
    name: DAST (OWASP ZAP CLI contra localhost)
    runs-on: ubuntu-latest
    needs: [sca]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Set up Python (para zap-cli)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: npm ci

      - name: Start app in background
        run: |
          nohup npm start >/tmp/app.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:3000/health && break || sleep 2
          done
          curl -s http://127.0.0.1:3000/health || (echo "App não respondeu" && exit 1)

      - name: Debug:docker pre-check
        run: |
          echo "==== Docker version/info ===="
          docker version || true
          docker info || true
          echo "==== Existing containers ===="
          docker ps -a || true

      - name: Ensure previous zap container removed
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^owasp-zap$'; then
            echo "Removing existing owasp-zap container..."
            docker rm -f owasp-zap || true
          fi

      - name: Pull latest ZAP image
        run: |
          echo "Baixando imagem estável do OWASP ZAP..."
          docker pull owasp/zap2docker-stable

      - name: Start ZAP daemon (Docker) - robust
        run: |
          set -x
          docker run -u zap --rm -d --name owasp-zap -p 127.0.0.1:8090:8090 owasp/zap2docker-stable \
            zap.sh -daemon -port 8090 -host 127.0.0.1 -config api.disablekey=true || (docker ps -a && docker logs owasp-zap || true; exit 1)
          # wait for ZAP to be ready
          for i in {1..40}; do
            if curl -sSf http://127.0.0.1:8090/ > /dev/null 2>&1; then
              echo "ZAP is responding"
              break
            fi
            sleep 2
          done
          echo "ZAP should be up at 127.0.0.1:8090"

      - name: Install zap-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install zap-cli

      - name: Run ZAP CLI quick-scan and save report
        env:
          ZAP_PORT: 8090
        run: |
          set -e
          echo "Running zap-cli quick-scan (spider + active) ..."
          timeout 1800 zap-cli --zap-url http://127.0.0.1:8090 quick-scan \
            --self-contained --start-options "-config api.disablekey=true" \
            --spider -r zap_report.html http://127.0.0.1:3000 || true
          if [ -f zap_report.html ]; then
            echo "ZAP report generated:"
            ls -l zap_report.html
          else
            echo "ZAP report NOT generated; collecting container logs for diagnosis:"
            docker ps -a || true
            docker logs owasp-zap || true
            exit 1
          fi

      - name: Upload ZAP report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan
          path: zap_report.html

      - name: Fail pipeline if High/Critical found in report
        if: always()
        run: |
          if grep -E "(Risk.*High|Risk.*Critical|High risk|Critical risk)" -i zap_report.html; then
            echo "::error::DAST encontrou achados High/Critical."
            exit 1
          else
            echo "Sem High/Critical no relatório ZAP."
          fi

      - name: Debug:docker status and logs (final)
        if: always()
        run: |
          echo "==== docker ps -a ===="
          docker ps -a || true
          echo "==== docker logs (owasp-zap) ===="
          docker logs owasp-zap || echo "no logs for owasp-zap"

  # Gate final
  release_gate:
    name: Gate de Release + Notificação (simples)
    runs-on: ubuntu-latest
    needs: [dast]
    if: ${{ needs.dast.result == 'success' }}
    steps:
      - name: (Opcional) Notificar via Webhook
        run: |
          if [ -n "${{ secrets.SECURITY_WEBHOOK_URL }}" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"text":"Pipeline aprovado (SAST/SCA/DAST). Pronto para release!"}' \
              "${{ secrets.SECURITY_WEBHOOK_URL }}"
          else
            echo "Webhook não configurado."
